<!DOCTYPE = html>
<html lang = "zh-Hant">
    <head>
        <meta charset="UTF-8">
        <title>Vanilla JS 購物車</title>
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <link rel = "stylesheet" href = "styles.css"/>
        <script src = "app.js" defer></script>
    </head> 
    <body>
        <header class= "site-header">
            <div class = "logo">我的商店</div>
            <div class = "cart-summary">
                <span class = "cart-count">0</span> 件商品 |
                NT$ <span class = "cart-total">0</span>
            </div>
        </header>

        <main class = "site-main">
            <section class = "product-filters">
              <!-- 之後可以放分類 / 搜尋 / 排序 -->
            </section>

            <!--登入遮罩-->
            <button id = "loginBtn">登入</button>
            
            <div class = "overlay hidden"></div>
            
            <div class = "login-modal hidden">
              <button class = "close-login">X</button>
              <div class = "login-content">
                <h2>歡迎登入</h2>
                <input type = "email" id = "username" placeholder="使用者名稱">
                <input type = "password" id = "password" placeholder="密碼">
                <button class = "submitLogin">登入</button>
              </div>
            </div>
            

            <section class = "product-grid">
              <!-- JS 負責從 JSON 讀取資料並動態生成卡片 -->
            <div class="product-card">
              <a href="products_img/sd.jpg" target="_blank">
              <img src="products_img/sd.jpg" alt="玩具士兵" class="product-image" /></a>
              <h3 class="product-title">玩具士兵</h3>
              <p class="product-price">NT$ 999</p>
              <button class="add-to-cart" data-product-id="p1">加入購物車</button>
              <button class="remove-from-cart" data-product-id="p1">從購物車移除</button>
            </div>
            
            <div class="product-card">
              <a href="products_img/car.jpg" target="_blank">
              <img src="products_img/car.jpg" alt="玩具跑車" class="product-image" /></a>
              <h3 class="product-title">玩具跑車</h3>
              <p class="product-price">NT$ 100</p>
              <button class="add-to-cart" data-product-id="p2">加入購物車</button>
              <button class="remove-from-cart" data-product-id="p2">從購物車移除</button>
            </div>

            <div class="product-card">
              <a href="products_img/gun.jpg" target="_blank">
              <img src="products_img/gun.jpg" alt="玩具槍" class="product-image" /></a>
              <h3 class="product-title">玩具槍</h3>
              <p class="product-price">NT$ 200</p>
              <button class="add-to-cart" data-product-id="p3">加入購物車</button>
              <button class="remove-from-cart" data-product-id="p3">從購物車移除</button>
            </div>
            </section>
        </main>

        <footer class ="site-footer">
            <small>&copy; 2026 我的商店. 保留所有權利.</small>
        </footer>


    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    
    </body>
</html>
